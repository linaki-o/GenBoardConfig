# Excel 表头 → 领域字段 的列语义映射
# 匹配方式：表头文本归一化（去空格/下划线/连字符/括号内容）后完全一致或包含
fields:
  pin_name:      ["管脚", "管脚名", "引脚", "引脚名", "pin", "pinname", "pad", "端口"]
  gpio_num:      ["gpio号", "gpio编号", "gpio", "gpio序号", "引脚号", "gpiopin", "编号"]
  function:      ["功能", "用途", "功能名称", "function", "usage", "描述"]
  config_key:    ["配置项", "配置项名称", "配置宏", "宏", "config", "configkey", "宏名"]
  expected_value: ["期望值", "期望", "期望配置", "目标值", "expected", "expectedvalue", "值"]
  chip_instance: ["芯片", "芯片实例", "gpio控制器", "控制器", "port", "chip", "实例"]
  polarity:      ["极性", "有效电平", "polarity", "active"]
  pull:          ["上下拉", "pull", "pullup", "上下拉方式"]
  mux:           ["复用", "复用功能", "mux", "af", "alternate"]
  bom_ref:       ["bom", "位号", "bom位号", "物料"]
  remark:        ["备注", "说明", "remark", "note", "comment"]
  source:        ["来源", "原理图", "source", "schematic"]

# 首行非表头时的兜底关键字（用于自动探测表头所在行）
header_hint_keywords: ["管脚", "引脚", "gpio", "功能", "配置", "期望"]
