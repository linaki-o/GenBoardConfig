# NTK 系列档案：Novatek 端口位表核对
#
# 核对范围（依据实际评审要求收敛）：
#   C 侧：只核对 PORT_<X>_DEFAULT_{OUT,DIR,PP,PU} 端口位表
#   Excel：只核对「GPIO  TYPE(输入输出类别)」列为 IN / OUT 的行
#   引脚来源：Excel 的「PIN Name」列（芯片引脚），不再依赖配置里的信号宏组
#
# 与 RTK 的差别见 docs/comparison_rules_rtk.md
id: ntk
name: NTK 系列（Novatek 端口位表核对）
enabled: true

excel:
  sheet: HSI
  header_keywords: ["schematic function", "chip section", "output pin", "pin name"]

  # 只核对满足条件的行（值大小写不敏感）
  row_filter:
    field: gpio_type          # ← 「GPIO  TYPE(输入输出类别)」列（G 列）
    values: [IN, OUT]
    empty_hint: "该列在当前表格中为空；若实际使用的列是「Chip Section」，把 field 改成 chip_section 即可"
    # 主列无匹配行时自动回退到备用列（并在报告中说明实际用了哪一列）
    fallback:
      field: chip_section
      values: [OUTPUT, INPUT]
      hint: "GPIO TYPE 列为空时，改用 Chip Section 列（Output/Input）作为过滤与方向来源"

  columns:
    pin_name: ["pin name"]
    net_name: ["schematic function"]
    gpio_type: ["gpio type", "gpio  type"]
    chip_section: ["chip section"]
    io_type: ["output pin"]
    power_on: ["power on"]
    power_saving: ["power saving"]
    power_off: ["power off"]
    description: ["description"]
    bom_ref: ["pin #"]
    remark: ["remark", "check result remark"]

  # 参与核对的属性：check 决定取数来源
  #   port_bit → 取端口位表 PORT_<X>_DEFAULT_<table>[bit]
  #
  # 对应关系（评审确认）：
  #   G 列「GPIO  TYPE(输入输出类别)」  ↔  PORT_X_DEFAULT_DIR
  #   H 列「Output PIN 设定类型」      ↔  PORT_X_DEFAULT_PP
  #   I 列「Power On」                 ↔  PORT_X_DEFAULT_OUT
  #   PORT_X_DEFAULT_PU               →  暂时忽略（Excel 无对应列）
  attributes:
    - {name: direction, label: 方向,     from: gpio_type, check: port_bit}
    - {name: io_type,   label: 输出类型, from: io_type,   check: port_bit}
    - {name: power_on,  label: 上电电平, from: power_on,  check: port_bit}

  # 单元格为「不适用」占位值时不参与判定（仍显示原文）
  na_values: ["NA", "N/A", "-", "--", "NONE", "NULL", "X"]

  # 期望值 → 期望语义值
  value_map:
    direction:
      IN: IN
      OUT: OUT
      Input: IN
      Output: OUT
      I/O: INOUT
    io_type:
      Push pull: HIGH
      Push-pull: HIGH
      Pushpull: HIGH
      Open Drain: LOW
      Open-drain: LOW
      Opendrain: LOW
    power_on:
      High: HIGH
      Low: LOW
      HIGH: HIGH
      LOW: LOW
    power_saving:
      High: HIGH
      Low: LOW
      HIGH: HIGH
      LOW: LOW
    power_off:
      High: HIGH
      Low: LOW
      HIGH: HIGH
      LOW: LOW

c_config:
  # 端口位表：PORT_C_DEFAULT_OUT / _DIR / _PP（_PU 暂时忽略）
  bit_tables:
    pattern: "PORT_{port}_DEFAULT_{attr}"
    attrs: [OUT, DIR, PP]
    bit_order: "desc"        # BitsToByte 参数自 bit7 到 bit0

  # Excel 属性 ← 端口位表属性
  attribute_source:
    direction: {table: DIR}
    io_type:   {table: PP}
    power_on:  {table: OUT}
  # 需要启用上拉核对时：把 attrs 加上 PU，并补一条 pull_up 属性 + attribute_source 映射

  # 同一 (端口,位,表) 被多行要求且期望值冲突时，禁止自动改写
  conflict_guard: true
